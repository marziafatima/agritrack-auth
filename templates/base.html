<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}AgriTrack{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{--g:#2f5d3a}
body{background:#f5f7f3;font-size:1.05rem}
.btn{font-size:1.05rem}
.btn-farm{background:var(--g);color:#fff}.btn-farm:hover{background:#244a2d;color:#fff}
.brand{color:var(--g)}
</style>
</head>
<body>
<div class="container py-4" style="max-width:{% block width %}460px{% endblock %}">
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}<div class="alert alert-{{ cat }} py-2">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block body %}{% endblock %}
</div>
</body>
</html>
